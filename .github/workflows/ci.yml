name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Revisión de tipos
        run: pnpm typecheck
      - name: Pruebas de las reglas del CRM
        run: pnpm test
      - name: Compilar
        run: pnpm build
